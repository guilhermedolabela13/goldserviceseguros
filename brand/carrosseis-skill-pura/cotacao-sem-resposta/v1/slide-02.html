<!doctype html>
<!-- Feito com a skill /carrossel pura (templates/slide-base.html), só com as cores da Gold trocadas no :root. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
<style>
:root{
  --primaria:#061C37; --texto:#061C37; --suave:#5A6573;
  --fundo:#FAF6E8; --profundo:#EDE4CC; --destaque:#8C6A28; --ouro:#D7B05A;
  --fonte:'Inter';
  --margem:80px;
}
*{box-sizing:border-box}
html,body{width:1080px;height:1350px;margin:0;overflow:hidden}
body{position:relative;font-family:var(--fonte),sans-serif;-webkit-font-smoothing:antialiased;color:var(--texto);
  background:radial-gradient(900px 700px at 80% 100%,var(--profundo),transparent 70%),var(--fundo)}
h1,p{margin:0;font-weight:500}
.marca{position:absolute;left:var(--margem);top:66px;display:flex;align-items:center;gap:12px;font-size:34px;letter-spacing:-1.5px;color:var(--primaria);z-index:2}
.marca img{width:36px;height:36px}
.titulo{position:absolute;left:var(--margem);right:var(--margem);top:200px;font-size:84px;line-height:1.04;letter-spacing:-3.4px;z-index:2}
.titulo em{font-style:normal;color:var(--destaque)}
.apoio{position:absolute;left:var(--margem);right:var(--margem);top:440px;font-size:32px;line-height:1.38;color:var(--suave);z-index:2}
.card{position:absolute;border-radius:28px;background:#ffffffcc;border:1px solid #fff;box-shadow:0 30px 70px #061c371f;overflow:hidden;z-index:2}
.asset{position:absolute}
.cena{position:absolute;inset:0;background-size:cover;background-position:center bottom;z-index:0;mix-blend-mode:multiply}
.cena.baixa{top:auto;bottom:0;background-size:auto 100%;background-repeat:no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent),linear-gradient(180deg,transparent,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent),linear-gradient(180deg,transparent,#000 22%);mask-composite:intersect}
.asset{mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent),linear-gradient(180deg,transparent,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent),linear-gradient(180deg,transparent,#000 22%);mask-composite:intersect}
.dado{position:absolute;left:var(--margem);right:var(--margem);border-radius:28px;background:#ffffff0d;border:1px solid #ffffff1f;padding:48px 56px;z-index:2}
.dado b{display:block;font-size:180px;line-height:1;font-weight:700;letter-spacing:-8px;color:var(--ouro)}
.dado span{display:block;margin-top:18px;font-size:32px;line-height:1.38;color:#DCE3ECcc}
.progresso{position:absolute;left:var(--margem);bottom:64px;display:flex;gap:8px;z-index:2}
.progresso i{width:28px;height:4px;border-radius:4px;background:#0000001a}.progresso i.on{background:var(--primaria)}
.rot{display:block;font-size:22px;font-weight:700;letter-spacing:2px;color:var(--destaque);margin-bottom:14px}
.fala{font-size:40px;line-height:1.3;letter-spacing:-.6px}
.etapa{position:absolute;left:var(--margem);top:150px;font-size:24px;font-weight:700;letter-spacing:2px;color:var(--destaque);z-index:2}
body.inverte{background:radial-gradient(900px 700px at 80% 100%,#12395F,transparent 70%),var(--primaria);color:#FAF6E8}
.inverte .marca{color:#FAF6E8}.inverte .titulo em{color:var(--ouro)}.inverte .apoio{color:#DCE3ECcc}
.inverte .progresso i{background:#ffffff26}.inverte .progresso i.on{background:var(--ouro)}
.botao{position:absolute;left:var(--margem);display:inline-flex;gap:14px;align-items:center;background:#FAF6E8;color:var(--primaria);font-size:34px;font-weight:600;padding:26px 44px;border-radius:999px;z-index:2}
</style>
</head>
<body>
  <div class="marca"><img src="../../marca/logo.svg" alt="">Gold Service Seguros</div>
  <h1 class="titulo">O silêncio quase nunca<br>é um <em>não.</em></h1>
  <p class="apoio" style="top:420px">Muitas vezes o cliente só não parou para comparar. Quem volta com contexto, e não com pressão, volta para a conversa.</p>
  <img class="asset" src="../../assets/3d/serie-01/02-celular-digitando.png" style="left:50%;transform:translateX(-50%);bottom:-60px;width:820px">
  <div class="progresso"><i></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
